# DOSBox-X configuration for MK1 DCS Sound ROM Builder
# Minimal config - mounts MK1_sound as C: drive

[sdl]
fullscreen = false
autolock = false

[dosbox]
memsize = 16

[cpu]
core               = dynamic
fpu                = true
cputype            = auto
cycles             = max 105%
turbo		= true

[autoexec]
# Mount current directory as C:
mount c .
c:
# Add current directory to PATH for HENRY.EXE and PLBUILD.EXE
path=Z:\;C:\;C:\TOOLS
set TEMP=C:\
set TMP=C:\
